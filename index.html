<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Resources</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #0066cc;
            color: white;
            padding: 40px 20px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 10px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            background: #004d99;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <h1>Sports Hub</h1>
    <p>Select a resource below</p>
</header>

<main>

    <div class="card">
        <h2>Gym </h2>
        <p>Open the gym page and workout resources.</p>
        <a href="gym.html" class="button">Open Gym Page</a>
    </div>

    
    <div class="card">
        <h2>The Chase</h2>
        <p>Open the Chase</p>
        <a href="chase.html" class="button">Open Chase</a>
    </div>

    <div class="card">
        <h2>GitHub Repository</h2>
        <p>View the source code for this project.</p>
        <a href="https://github.com/d90gecko-spec/Sports"
           target="_blank"
           rel="noopener noreferrer"
           class="button">
           View Repository
        </a>
    </div>

</main>

<footer>
    © 2026 Sports Hub
</footer>

</body>
</html>
